<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="kitePaper" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Bamboo Frame Spars -->
    <line x1="250" y1="50" x2="250" y2="400" stroke="#fde047" stroke-width="6"/>
    <line x1="100" y1="180" x2="400" y2="180" stroke="#fde047" stroke-width="6"/>

    <!-- 5-Pointed Star Kite Body -->
    <polygon points="250,50 290,170 420,180 320,260 360,390 250,310 140,390 180,260 80,180 210,170" fill="url(#kitePaper)"/>

    <!-- Smiling Mascot Face on Kite -->
    <circle cx="215" cy="230" r="15" fill="#ffffff"/>
    <circle cx="285" cy="230" r="15" fill="#ffffff"/>
    <circle cx="218" cy="230" r="9" fill="#0f172a"/>
    <circle cx="282" cy="230" r="9" fill="#0f172a"/>
    <path d="M 235 260 Q 250 280 265 260" fill="none" stroke="#be185d" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Trailing Tassel Ribbons -->
    <path d="M 250 310 Q 230 380 260 440" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>

  </g>
</svg>