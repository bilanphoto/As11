<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Colorful Traditional Thai 5-pointed Star Kite (Chula Kite) -->
  <g filter="url(#dropShadow)">
    <polygon points="256,70 300,190 420,190 325,260 360,370 256,305 152,370 187,260 92,190 212,190" fill="#f43f5e" stroke="#e11d48" stroke-width="6"/>
    <!-- Inner Pattern -->
    <polygon points="256,120 286,200 370,200 305,250 330,320 256,275 182,320 207,250 142,200 226,200" fill="#fde047"/>
    <!-- Smiling Face in Center of Kite -->
    <circle cx="240" cy="225" r="8" fill="#0f172a"/>
    <circle cx="272" cy="225" r="8" fill="#0f172a"/>
    <path d="M 248 240 Q 256 250 264 240" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- Kite Tail Ribbon -->
    <path d="M 256 370 Q 220 410 260 440" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="256" y="455" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0284c7" text-anchor="middle">ฬ จุฬา ท่าผยอง</text>

</svg>