<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="flagPole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="redStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="blueStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Flagpole Base & Staff -->
    <rect x="95" y="70" width="20" height="375" rx="10" fill="url(#flagPole)"/>
    <circle cx="105" cy="65" r="18" fill="url(#flagPole)"/>

    <!-- 3D Rippling Thai Flag Stripes (Red, White, Blue, White, Red) -->
    <!-- Top Red -->
    <path d="M 115 100 Q 230 70 320 110 T 430 100 L 430 140 Q 320 150 230 110 T 115 140 Z" fill="url(#redStripe)"/>
    <!-- Top White -->
    <path d="M 115 140 Q 230 110 320 150 T 430 140 L 430 180 Q 320 190 230 150 T 115 180 Z" fill="#ffffff"/>
    <!-- Middle Double-Width Blue -->
    <path d="M 115 180 Q 230 150 320 190 T 430 180 L 430 260 Q 320 270 230 230 T 115 260 Z" fill="url(#blueStripe)"/>
    <!-- Bottom White -->
    <path d="M 115 260 Q 230 230 320 270 T 430 260 L 430 300 Q 320 310 230 270 T 115 300 Z" fill="#ffffff"/>
    <!-- Bottom Red -->
    <path d="M 115 300 Q 230 270 320 310 T 430 300 L 430 340 Q 320 350 230 310 T 115 340 Z" fill="url(#redStripe)"/>

  </g>
</svg>