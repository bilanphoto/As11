<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Fluttering Thai National Flag -->
  <!-- Flagpole -->
  <rect x="100" y="70" width="16" height="340" rx="8" fill="#cbd5e1" filter="url(#dropShadow)"/>
  <circle cx="108" cy="65" r="18" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
  <!-- Flag Waves (Red - White - Blue - White - Red) -->
  <g filter="url(#dropShadow)">
    <path d="M 116 85 Q 230 65 300 95 Q 370 125 410 85 L 410 125 Q 370 165 300 135 Q 230 105 116 125 Z" fill="#ef4444"/>
    <path d="M 116 125 Q 230 105 300 135 Q 370 165 410 125 L 410 165 Q 370 205 300 175 Q 230 145 116 165 Z" fill="#ffffff"/>
    <path d="M 116 165 Q 230 145 300 175 Q 370 205 410 165 L 410 245 Q 370 285 300 255 Q 230 225 116 245 Z" fill="#1e3a8a"/>
    <path d="M 116 245 Q 230 225 300 255 Q 370 285 410 245 L 410 285 Q 370 325 300 295 Q 230 265 116 285 Z" fill="#ffffff"/>
    <path d="M 116 285 Q 230 265 300 295 Q 370 325 410 285 L 410 325 Q 370 365 300 335 Q 230 305 116 325 Z" fill="#ef4444"/>
  </g>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ธ ธง คนนิยม</text>

</svg>