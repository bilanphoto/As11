<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="goldPhan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Jasmine Flower Offerings on Top -->
    <circle cx="250" cy="180" r="28" fill="#fef08a"/>
    <circle cx="210" cy="190" r="22" fill="#ffffff"/>
    <circle cx="290" cy="190" r="22" fill="#ffffff"/>
    <circle cx="170" cy="205" r="18" fill="#f43f5e"/>
    <circle cx="330" cy="205" r="18" fill="#f43f5e"/>

    <!-- Wide Serrated Golden Tray Dish -->
    <ellipse cx="250" cy="230" rx="175" ry="32" fill="url(#goldPhan)"/>
    <path d="M 75 230 Q 250 280 425 230 L 390 280 Q 250 320 110 280 Z" fill="url(#goldPhan)"/>

    <!-- Fluted Pedestal Stem -->
    <path d="M 185 290 Q 250 310 315 290 L 295 380 Q 250 395 205 380 Z" fill="url(#goldPhan)"/>

    <!-- Broad Base (ฐานพาน) -->
    <ellipse cx="250" cy="420" rx="145" ry="26" fill="url(#goldPhan)"/>
    <path d="M 115 410 Q 250 435 385 410 L 395 435 Q 250 460 105 435 Z" fill="url(#goldPhan)"/>

  </g>
</svg>