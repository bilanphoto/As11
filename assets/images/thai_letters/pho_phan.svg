<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgWarm)"/>
  <!-- Traditional Golden Pedestal Tray (Phan) with Flowers -->
  <g filter="url(#dropShadow)">
    <!-- Base Foot -->
    <ellipse cx="256" cy="380" rx="90" ry="25" fill="#f59e0b" stroke="#b45309" stroke-width="5"/>
    <!-- Stem Column -->
    <path d="M 230 380 L 236 290 L 276 290 L 282 380 Z" fill="#fbbf24" stroke="#d97706" stroke-width="5"/>
    <!-- Wide Top Tray Bowl -->
    <path d="M 90 210 Q 120 290 236 290 L 276 290 Q 392 290 422 210 Z" fill="#f59e0b" stroke="#b45309" stroke-width="6"/>
    <ellipse cx="256" cy="210" rx="166" ry="40" fill="#fde047" stroke="#d97706" stroke-width="6"/>
    <!-- Flowers in Phan -->
    <circle cx="210" cy="180" r="28" fill="#ec4899"/>
    <circle cx="256" cy="160" r="32" fill="#ef4444"/>
    <circle cx="302" cy="180" r="28" fill="#f43f5e"/>
    <circle cx="256" cy="160" r="12" fill="#facc15"/>
  </g>
  <text x="256" y="455" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#b45309" text-anchor="middle">พ พาน วางตั้ง</text>

</svg>