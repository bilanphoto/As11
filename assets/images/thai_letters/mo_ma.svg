<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgEmerald)"/>
  <!-- Cute Smiling Pony with Colorful Flowing Mane -->
  <g filter="url(#dropShadow)">
    <!-- Horse Body -->
    <ellipse cx="256" cy="300" rx="100" ry="75" fill="#f59e0b"/>
    <!-- Legs -->
    <rect x="180" y="340" width="22" height="65" rx="10" fill="#d97706"/>
    <rect x="220" y="340" width="22" height="65" rx="10" fill="#b45309"/>
    <rect x="270" y="340" width="22" height="65" rx="10" fill="#d97706"/>
    <rect x="310" y="340" width="22" height="65" rx="10" fill="#b45309"/>
    <!-- Head & Neck -->
    <path d="M 290 300 L 330 200 L 375 220 L 340 310 Z" fill="#f59e0b"/>
    <circle cx="355" cy="210" r="45" fill="#f59e0b"/>
    <polygon points="340,165 355,130 365,165" fill="#f59e0b"/>
    <!-- Flowing Rainbow Mane -->
    <path d="M 330 160 Q 300 200 310 260" stroke="#ef4444" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 315 170 Q 285 210 295 270" stroke="#f59e0b" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Eye & Smile -->
    <circle cx="365" cy="195" r="9" fill="#0f172a"/>
    <circle cx="367" cy="192" r="3" fill="#ffffff"/>
    <path d="M 375 225 Q 385 235 375 240" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M 160 280 Q 120 300 130 360" stroke="#ef4444" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#78350f" text-anchor="middle">ม ม้า คึกคัก</text>

</svg>