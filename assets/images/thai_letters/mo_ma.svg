<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="horseCoat" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="90%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <radialGradient id="horseMane" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e0b02"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Tail in back -->
    <path d="M 125 350 Q 80 400 120 435 Q 110 380 145 365 Z" fill="url(#horseMane)"/>

    <!-- Body -->
    <ellipse cx="230" cy="345" rx="115" ry="85" fill="url(#horseCoat)"/>

    <!-- Legs & Hooves -->
    <rect x="160" y="380" width="28" height="65" rx="12" fill="url(#horseCoat)"/>
    <rect x="160" y="425" width="28" height="20" rx="6" fill="#1e293b"/>
    <rect x="270" y="380" width="28" height="65" rx="12" fill="url(#horseCoat)"/>
    <rect x="270" y="425" width="28" height="20" rx="6" fill="#1e293b"/>

    <!-- Head & Neck -->
    <path d="M 270 340 L 330 220 L 280 200 L 220 320 Z" fill="url(#horseCoat)"/>
    <circle cx="310" cy="205" r="75" fill="url(#horseCoat)"/>
    <ellipse cx="360" cy="235" rx="42" ry="32" fill="#fdba74"/>

    <!-- Ears -->
    <polygon points="280,145 295,95 315,145" fill="url(#horseCoat)"/>
    <polygon points="255,155 265,110 285,155" fill="url(#horseCoat)"/>

    <!-- Dark Mane -->
    <path d="M 270 140 Q 240 180 220 270 Q 250 250 275 200 Z" fill="url(#horseMane)"/>

    <!-- Glossy Eye & Nostril -->
    <circle cx="320" cy="190" r="15" fill="#0f172a"/>
    <circle cx="315" cy="184" r="5" fill="#ffffff"/>
    <circle cx="370" cy="235" r="6" fill="#7c2d12"/>

  </g>
</svg>