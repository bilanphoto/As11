<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgWarm)"/>
  <!-- Cute Smiling Mouse with Cheese -->
  <!-- Mouse Ears -->
  <circle cx="190" cy="160" r="45" fill="#fbcfe8" stroke="#94a3b8" stroke-width="8" filter="url(#dropShadow)"/>
  <circle cx="322" cy="160" r="45" fill="#fbcfe8" stroke="#94a3b8" stroke-width="8" filter="url(#dropShadow)"/>
  <!-- Body & Head -->
  <ellipse cx="256" cy="250" rx="95" ry="90" fill="#94a3b8" filter="url(#dropShadow)"/>
  <ellipse cx="256" cy="270" rx="65" ry="60" fill="#f1f5f9"/>
  <!-- Nose & Whiskers -->
  <circle cx="256" cy="250" r="14" fill="#f43f5e"/>
  <line x1="220" y1="245" x2="160" y2="235" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="255" x2="160" y2="260" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="292" y1="245" x2="352" y2="235" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="292" y1="255" x2="352" y2="260" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="220" cy="205" r="12" fill="#0f172a"/>
  <circle cx="224" cy="201" r="4" fill="#ffffff"/>
  <circle cx="292" cy="205" r="12" fill="#0f172a"/>
  <circle cx="296" cy="201" r="4" fill="#ffffff"/>
  <!-- Cheese Wedge in Paws -->
  <polygon points="230,300 290,300 270,350" fill="#facc15" stroke="#eab308" stroke-width="4" filter="url(#dropShadow)"/>
  <circle cx="250" cy="315" r="5" fill="#ca8a04"/>
  <circle cx="270" cy="325" r="4" fill="#ca8a04"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#78350f" text-anchor="middle">น หนู ขวักไขว่</text>

</svg>