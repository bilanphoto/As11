<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="mouseFur" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <radialGradient id="mouseEarInner" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <linearGradient id="cheeseYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Big Rounded Ears -->
    <circle cx="155" cy="150" r="60" fill="url(#mouseFur)"/>
    <circle cx="155" cy="150" r="38" fill="url(#mouseEarInner)"/>

    <circle cx="345" cy="150" r="60" fill="url(#mouseFur)"/>
    <circle cx="345" cy="150" r="38" fill="url(#mouseEarInner)"/>

    <!-- Mouse Body -->
    <ellipse cx="250" cy="320" rx="125" ry="110" fill="url(#mouseFur)"/>

    <!-- Mouse Head -->
    <circle cx="250" cy="225" r="95" fill="url(#mouseFur)"/>

    <!-- Glossy Eyes -->
    <circle cx="205" cy="210" r="16" fill="#0f172a"/>
    <circle cx="295" cy="210" r="16" fill="#0f172a"/>
    <circle cx="200" cy="204" r="6" fill="#ffffff"/>
    <circle cx="290" cy="204" r="6" fill="#ffffff"/>

    <!-- Cute Pink Nose & Whiskers -->
    <ellipse cx="250" cy="245" rx="12" ry="9" fill="#f43f5e"/>
    <line x1="165" y1="240" x2="225" y2="245" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="165" y1="255" x2="225" y2="250" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="335" y1="240" x2="275" y2="245" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="335" y1="255" x2="275" y2="250" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- 3D Wedge of Swiss Cheese in Paws -->
    <polygon points="190,340 310,340 250,420" fill="url(#cheeseYellow)"/>
    <ellipse cx="250" cy="340" rx="60" ry="16" fill="#fef08a"/>
    <circle cx="230" cy="365" r="9" fill="#ca8a04" opacity="0.6"/>
    <circle cx="270" cy="385" r="12" fill="#ca8a04" opacity="0.6"/>

  </g>
</svg>