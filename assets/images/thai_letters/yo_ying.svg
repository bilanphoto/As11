<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgRose)"/>
  <!-- Cute Smiling Thai Girl with Chignon & Flower -->
  <!-- Body / Dress -->
  <path d="M 190 350 L 190 400 L 322 400 L 322 350 Q 256 370 190 350 Z" fill="#ec4899" filter="url(#dropShadow)"/>
  <path d="M 210 270 L 180 360 L 332 360 L 302 270 Z" fill="#f472b6"/>
  <!-- Gold Sabai -->
  <path d="M 205 270 L 315 360 L 290 370 L 180 280 Z" fill="#fbbf24"/>
  <!-- Head -->
  <circle cx="256" cy="200" r="75" fill="#fde047" filter="url(#dropShadow)"/>
  <circle cx="256" cy="200" r="75" fill="#fed7aa"/>
  <!-- Hair -->
  <path d="M 181 200 C 181 120 331 120 331 200 C 310 150 200 150 181 200 Z" fill="#1e293b"/>
  <!-- Chignon Bun -->
  <circle cx="325" cy="135" r="32" fill="#1e293b"/>
  <!-- White Jasmine Flower -->
  <circle cx="300" cy="140" r="16" fill="#ffffff" stroke="#fbcfe8" stroke-width="3"/>
  <circle cx="300" cy="140" r="6" fill="#facc15"/>
  <!-- Face -->
  <circle cx="228" cy="200" r="10" fill="#0f172a"/>
  <circle cx="231" cy="197" r="3" fill="#ffffff"/>
  <circle cx="284" cy="200" r="10" fill="#0f172a"/>
  <circle cx="287" cy="197" r="3" fill="#ffffff"/>
  <circle cx="212" cy="216" r="10" fill="#f43f5e" opacity="0.6"/>
  <circle cx="300" cy="216" r="10" fill="#f43f5e" opacity="0.6"/>
  <path d="M 242 225 Q 256 242 270 225" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
  <text x="256" y="455" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#be185d" text-anchor="middle">ญ หญิง โสภา</text>

</svg>