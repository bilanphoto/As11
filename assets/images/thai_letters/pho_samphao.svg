<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="shipWood" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="sailRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Masts -->
    <rect x="235" y="80" width="14" height="250" rx="7" fill="#451a03"/>
    <rect x="335" y="130" width="12" height="200" rx="6" fill="#451a03"/>

    <!-- Billowing Red Canvas Sails with Bamboo Battens -->
    <path d="M 245 95 Q 160 140 185 270 L 245 250 Z" fill="url(#sailRed)"/>
    <line x1="245" y1="135" x2="175" y2="160" stroke="#fef08a" stroke-width="3"/>
    <line x1="245" y1="185" x2="175" y2="205" stroke="#fef08a" stroke-width="3"/>

    <path d="M 345 140 Q 280 180 300 270 L 345 255 Z" fill="url(#sailRed)"/>

    <!-- 3D Ship Hull -->
    <path d="M 100 290 Q 250 330 400 290 L 370 380 Q 250 410 130 380 Z" fill="url(#shipWood)"/>
    <path d="M 90 280 Q 250 310 410 280 L 400 300 Q 250 330 100 300 Z" fill="#ca8a04"/>

    <!-- Ocean Crest Waves -->
    <path d="M 60 410 Q 120 370 180 410 T 300 410 T 420 410 T 460 410" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>

  </g>
</svg>