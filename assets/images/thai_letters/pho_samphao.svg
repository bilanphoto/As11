<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Traditional Chinese-Thai Sailing Junk Ship on Waves -->
  <!-- Ocean Waves -->
  <path d="M 40 370 Q 120 340 200 370 Q 280 400 360 370 Q 440 340 480 370 L 480 440 L 40 440 Z" fill="#0284c7"/>
  <path d="M 60 385 Q 140 360 220 385 Q 300 410 380 385 Q 460 360 480 385 L 480 440 L 60 440 Z" fill="#0369a1"/>
  <!-- Boat Hull -->
  <g filter="url(#dropShadow)">
    <path d="M 110 320 Q 256 360 390 300 L 410 350 Q 256 400 90 350 Z" fill="#b45309" stroke="#78350f" stroke-width="6"/>
    <!-- Masts -->
    <rect x="200" y="90" width="12" height="240" fill="#78350f"/>
    <rect x="310" y="120" width="12" height="210" fill="#78350f"/>
    <!-- Red Billowing Sails -->
    <path d="M 212 100 Q 280 140 212 280 L 140 250 Q 170 140 212 100 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>
    <path d="M 322 130 Q 380 160 322 280 L 260 260 Q 290 160 322 130 Z" fill="#f97316" stroke="#c2410c" stroke-width="4"/>
  </g>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0369a1" text-anchor="middle">ภ สำเภา กางใบ</text>

</svg>