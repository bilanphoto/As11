<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Decorative Spear / Staff -->
  <g transform="translate(256, 256) rotate(-25) translate(-256, -256)" filter="url(#dropShadow)">
    <!-- Wooden Pole -->
    <rect x="246" y="140" width="20" height="260" rx="10" fill="#92400e" stroke="#78350f" stroke-width="4"/>
    <!-- Golden Socket -->
    <rect x="236" y="110" width="40" height="40" rx="8" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <!-- Spear Tip -->
    <path d="M 230 110 Q 256 20 282 110 Q 256 125 230 110 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="6"/>
    <path d="M 256 30 L 256 115" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Red Silk Tassel -->
    <circle cx="236" cy="130" r="14" fill="#ef4444"/>
    <path d="M 226 135 Q 200 170 215 200" stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0369a1" text-anchor="middle">ฏ ปฏัก หุนหัน</text>

</svg>