<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="rishiSkin" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="65%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="tigerRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Wooden Gnarled Staff in hand -->
    <path d="M 360 435 L 360 170 Q 360 130 390 130 Q 410 130 400 160" fill="none" stroke="#78350f" stroke-width="18" stroke-linecap="round"/>

    <!-- Tiger Skin Robe -->
    <path d="M 160 300 Q 250 270 340 300 L 365 435 Q 250 455 135 435 Z" fill="url(#tigerRobe)"/>
    <!-- Tiger Stripes on Robe -->
    <path d="M 180 340 L 220 350 L 190 365" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 310 350 L 270 365 L 300 380" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="250" cy="190" r="95" fill="url(#rishiSkin)"/>

    <!-- Tall Rishi Hat (หมวกฤๅษีทรงกรวย) -->
    <path d="M 180 150 L 250 50 L 320 150 Z" fill="url(#tigerRobe)"/>
    <circle cx="250" cy="50" r="10" fill="#facc15"/>

    <!-- Long White Beard flowing down -->
    <path d="M 175 220 Q 250 360 325 220 Z" fill="#ffffff"/>

    <!-- Eyes & Rosary Beads -->
    <circle cx="210" cy="180" r="12" fill="#0f172a"/>
    <circle cx="290" cy="180" r="12" fill="#0f172a"/>
    <circle cx="206" cy="176" r="4" fill="#ffffff"/>
    <circle cx="286" cy="176" r="4" fill="#ffffff"/>

  </g>
</svg>