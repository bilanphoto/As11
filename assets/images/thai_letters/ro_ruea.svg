<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Cheerful Wooden Rowing Boat on River -->
  <g filter="url(#dropShadow)">
    <!-- Wooden Boat Hull -->
    <path d="M 100 270 Q 256 340 412 270 L 380 340 Q 256 390 132 340 Z" fill="#b45309" stroke="#78350f" stroke-width="6"/>
    <!-- Inner Hull -->
    <ellipse cx="256" cy="285" rx="140" ry="25" fill="#d97706"/>
    <!-- Cute Rowing Oars -->
    <line x1="160" y1="230" x2="110" y2="350" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="105" cy="355" rx="15" ry="25" fill="#d97706" transform="rotate(-30, 105, 355)"/>
    <line x1="352" y1="230" x2="402" y2="350" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="407" cy="355" rx="15" ry="25" fill="#d97706" transform="rotate(30, 407, 355)"/>
  </g>
  <!-- Smiling Face on Boat -->
  <circle cx="230" cy="310" r="10" fill="#0f172a"/>
  <circle cx="282" cy="310" r="10" fill="#0f172a"/>
  <path d="M 246 325 Q 256 335 266 325" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <!-- River Waves -->
  <path d="M 40 370 Q 120 350 200 370 Q 280 390 360 370 Q 440 350 480 370" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0369a1" text-anchor="middle">ร เรือ พายไป</text>

</svg>