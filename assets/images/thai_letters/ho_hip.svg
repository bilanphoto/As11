<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgPurple)"/>
  <!-- Cute Wooden Treasure Chest Overflowing with Gold -->
  <g filter="url(#dropShadow)">
    <!-- Chest Base -->
    <rect x="120" y="240" width="272" height="140" rx="20" fill="#92400e" stroke="#78350f" stroke-width="6"/>
    <!-- Gold Trimming Bands -->
    <rect x="160" y="240" width="20" height="140" fill="#facc15"/>
    <rect x="332" y="240" width="20" height="140" fill="#facc15"/>
    <!-- Chest Lid Dome -->
    <path d="M 120 240 Q 256 150 392 240 Z" fill="#b45309" stroke="#78350f" stroke-width="6"/>
    <path d="M 160 240 Q 256 160 170 200" stroke="#facc15" stroke-width="14" fill="none"/>
    <path d="M 332 240 Q 256 160 342 200" stroke="#facc15" stroke-width="14" fill="none"/>
    <!-- Keyhole Clasp -->
    <rect x="240" y="230" width="32" height="45" rx="8" fill="#fde047" stroke="#b45309" stroke-width="4"/>
    <circle cx="256" cy="245" r="5" fill="#0f172a"/>
  </g>
  <!-- Sparkles -->
  <path d="M 210 130 L 215 110 L 220 130 L 240 135 L 220 140 L 215 160 L 210 140 L 190 135 Z" fill="#fbbf24" filter="url(#softGlow)"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#7e22ce" text-anchor="middle">ห หีบ ใส่ผ้า</text>

</svg>