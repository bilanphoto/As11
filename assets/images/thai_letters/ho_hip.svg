<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="chestWood" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="60%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="goldCoins" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Chest Base Box -->
    <rect x="90" y="270" width="320" height="150" rx="18" fill="url(#chestWood)"/>
    <rect x="90" y="270" width="320" height="24" fill="url(#goldCoins)"/>
    <rect x="90" y="380" width="320" height="18" fill="url(#goldCoins)"/>

    <!-- Opened Arched Lid in back -->
    <path d="M 90 270 Q 250 140 410 270 L 400 220 Q 250 90 100 220 Z" fill="url(#chestWood)"/>
    <path d="M 90 270 Q 250 140 410 270" stroke="url(#goldCoins)" stroke-width="16" fill="none"/>

    <!-- Overflowing Mount of Gold Coins & Rubies -->
    <ellipse cx="250" cy="270" rx="140" ry="35" fill="url(#goldCoins)"/>
    <circle cx="210" cy="265" r="16" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="250" cy="260" r="18" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="290" cy="265" r="16" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="170" cy="275" r="14" fill="#ef4444"/>
    <circle cx="330" cy="275" r="14" fill="#10b981"/>

    <!-- Golden Lock Hasp -->
    <rect x="235" y="280" width="30" height="40" rx="6" fill="url(#goldCoins)"/>
    <circle cx="250" cy="295" r="5" fill="#451a03"/>

  </g>
</svg>