<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="boySkin" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="65%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba04b"/>
    </radialGradient>
    <radialGradient id="helmetGreen" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Uniform Body -->
    <path d="M 165 310 Q 250 290 335 310 L 355 435 Q 250 450 145 435 Z" fill="#15803d"/>
    <!-- Belt -->
    <rect x="155" y="380" width="190" height="24" fill="#1e293b"/>
    <rect x="235" y="376" width="30" height="32" rx="4" fill="#facc15"/>

    <!-- Head -->
    <circle cx="250" cy="205" r="95" fill="url(#boySkin)"/>

    <!-- Military Helmet -->
    <path d="M 140 180 Q 250 70 360 180 Q 250 160 140 180 Z" fill="url(#helmetGreen)"/>
    <ellipse cx="250" cy="180" rx="112" ry="20" fill="#166534"/>
    <!-- Golden Star Badge on Helmet -->
    <polygon points="250,110 255,125 270,125 258,135 262,150 250,140 238,150 242,135 230,125 245,125" fill="#fde047"/>

    <!-- Eyes & Smile -->
    <circle cx="205" cy="210" r="14" fill="#0f172a"/>
    <circle cx="295" cy="210" r="14" fill="#0f172a"/>
    <circle cx="201" cy="204" r="5" fill="#ffffff"/>
    <circle cx="291" cy="204" r="5" fill="#ffffff"/>
    <path d="M 235 240 Q 250 255 265 240" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>

    <!-- Saluting Arm -->
    <path d="M 335 320 L 375 220 L 340 200" fill="none" stroke="url(#boySkin)" stroke-width="26" stroke-linecap="round"/>

  </g>
</svg>