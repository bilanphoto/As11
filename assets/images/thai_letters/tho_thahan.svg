<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgEmerald)"/>
  <!-- Cute Smiling Toy Soldier with Green Beret -->
  <!-- Face -->
  <circle cx="256" cy="190" r="75" fill="#fed7aa" filter="url(#dropShadow)"/>
  <!-- Green Beret -->
  <ellipse cx="250" cy="130" rx="85" ry="35" fill="#15803d" filter="url(#dropShadow)"/>
  <circle cx="290" cy="130" r="14" fill="#fbbf24"/>
  <!-- Eyes -->
  <circle cx="228" cy="190" r="10" fill="#0f172a"/>
  <circle cx="231" cy="187" r="3" fill="#ffffff"/>
  <circle cx="284" cy="190" r="10" fill="#0f172a"/>
  <circle cx="287" cy="187" r="3" fill="#ffffff"/>
  <circle cx="210" cy="205" r="8" fill="#f43f5e" opacity="0.6"/>
  <circle cx="302" cy="205" r="8" fill="#f43f5e" opacity="0.6"/>
  <path d="M 244 212 Q 256 226 268 212" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <!-- Camouflage / Green Uniform -->
  <path d="M 180 260 L 332 260 L 342 390 L 170 390 Z" fill="#166534" filter="url(#dropShadow)"/>
  <rect x="246" y="260" width="20" height="130" fill="#15803d"/>
  <circle cx="256" cy="290" r="6" fill="#fbbf24"/>
  <circle cx="256" cy="330" r="6" fill="#fbbf24"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#14532d" text-anchor="middle">ท ทหาร อดทน</text>

</svg>