<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Shiny 3D Steel Chain with Smiling Face -->
  <g filter="url(#dropShadow)">
    <!-- Link 1 -->
    <rect x="110" y="140" width="130" height="70" rx="35" fill="none" stroke="#94a3b8" stroke-width="26"/>
    <rect x="110" y="140" width="130" height="70" rx="35" fill="none" stroke="#e2e8f0" stroke-width="14"/>
    <!-- Link 2 (Vertical) -->
    <rect x="220" y="180" width="70" height="140" rx="35" fill="none" stroke="#64748b" stroke-width="26"/>
    <rect x="220" y="180" width="70" height="140" rx="35" fill="none" stroke="#cbd5e1" stroke-width="14"/>
    <!-- Face on center link -->
    <circle cx="242" cy="245" r="8" fill="#0f172a"/>
    <circle cx="268" cy="245" r="8" fill="#0f172a"/>
    <path d="M 248 262 Q 255 272 262 262" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- Link 3 -->
    <rect x="270" y="270" width="130" height="70" rx="35" fill="none" stroke="#94a3b8" stroke-width="26"/>
    <rect x="270" y="270" width="130" height="70" rx="35" fill="none" stroke="#e2e8f0" stroke-width="14"/>
  </g>
  <!-- Sparkles -->
  <path d="M 120 120 L 125 100 L 130 120 L 150 125 L 130 130 L 125 150 L 120 130 L 100 125 Z" fill="#fbbf24"/>
  <path d="M 390 250 L 394 235 L 398 250 L 413 254 L 398 258 L 394 273 L 390 258 L 375 254 Z" fill="#38bdf8"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0284c7" text-anchor="middle">ซ โซ่ ล่ามที</text>

</svg>