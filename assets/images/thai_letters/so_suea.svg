<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="tigerOrange" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Round Ears -->
    <circle cx="160" cy="140" r="45" fill="url(#tigerOrange)"/>
    <circle cx="160" cy="140" r="26" fill="#fef08a"/>
    <circle cx="340" cy="140" r="45" fill="url(#tigerOrange)"/>
    <circle cx="340" cy="140" r="26" fill="#fef08a"/>

    <!-- Cub Body -->
    <ellipse cx="250" cy="330" rx="120" ry="95" fill="url(#tigerOrange)"/>

    <!-- Head -->
    <circle cx="250" cy="210" r="98" fill="url(#tigerOrange)"/>

    <!-- Black Tiger Stripes -->
    <polygon points="250,120 242,160 258,160" fill="#1e293b"/>
    <polygon points="175,190 205,195 190,205" fill="#1e293b"/>
    <polygon points="325,190 295,195 310,205" fill="#1e293b"/>

    <!-- White Muzzle -->
    <ellipse cx="250" cy="245" rx="42" ry="30" fill="#ffffff"/>
    <polygon points="250,230 240,242 260,242" fill="#f43f5e"/>
    <path d="M 235 255 Q 250 270 265 255" fill="none" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>

    <!-- Huge Amber Eyes -->
    <circle cx="205" cy="195" r="16" fill="#facc15"/>
    <circle cx="205" cy="195" r="10" fill="#0f172a"/>
    <circle cx="201" cy="190" r="4" fill="#ffffff"/>

    <circle cx="295" cy="195" r="16" fill="#facc15"/>
    <circle cx="295" cy="195" r="10" fill="#0f172a"/>
    <circle cx="291" cy="190" r="4" fill="#ffffff"/>

  </g>
</svg>