<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="tubCeramic" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </radialGradient>
    <radialGradient id="duckYellow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Clawfoot Tub Base -->
    <rect x="130" y="400" width="30" height="35" rx="8" fill="#ca8a04"/>
    <rect x="340" y="400" width="30" height="35" rx="8" fill="#ca8a04"/>

    <!-- Bathtub Main Bowl -->
    <path d="M 90 240 Q 250 210 410 240 L 380 390 Q 250 420 120 390 Z" fill="url(#tubCeramic)"/>
    <ellipse cx="250" cy="240" rx="160" ry="26" fill="#38bdf8"/>

    <!-- Foamy Suds & Bubbles -->
    <circle cx="160" cy="225" r="22" fill="#ffffff" opacity="0.9"/>
    <circle cx="195" cy="215" r="26" fill="#ffffff" opacity="0.9"/>
    <circle cx="240" cy="220" r="30" fill="#ffffff" opacity="0.9"/>
    <circle cx="285" cy="215" r="25" fill="#ffffff" opacity="0.9"/>
    <circle cx="330" cy="225" r="22" fill="#ffffff" opacity="0.9"/>

    <!-- Cute 3D Yellow Rubber Ducky floating -->
    <ellipse cx="250" cy="180" rx="35" ry="25" fill="url(#duckYellow)"/>
    <circle cx="270" cy="155" r="20" fill="url(#duckYellow)"/>
    <polygon points="285,155 310,160 285,168" fill="#f97316"/>
    <circle cx="275" cy="150" r="4" fill="#0f172a"/>

  </g>
</svg>