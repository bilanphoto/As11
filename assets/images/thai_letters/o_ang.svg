<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Clear Porcelain Water Basin / Bowl Filled with Water -->
  <g filter="url(#dropShadow)">
    <ellipse cx="256" cy="260" rx="160" ry="60" fill="#38bdf8" stroke="#0284c7" stroke-width="6"/>
    <!-- Basin Body -->
    <path d="M 96 260 Q 120 380 256 380 Q 392 380 416 260 Z" fill="#ffffff" stroke="#bae6fd" stroke-width="8"/>
    <!-- Water Ripple -->
    <ellipse cx="256" cy="260" rx="140" ry="45" fill="#7dd3fc"/>
    <ellipse cx="256" cy="260" rx="100" ry="30" fill="#bae6fd"/>
    <!-- Cute Rubber Duck in Basin -->
    <circle cx="256" cy="235" r="28" fill="#facc15"/>
    <ellipse cx="256" cy="255" rx="38" ry="22" fill="#facc15"/>
    <circle cx="270" cy="230" r="5" fill="#0f172a"/>
    <polygon points="284,235 304,238 284,242" fill="#f97316"/>
  </g>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0284c7" text-anchor="middle">อ อ่าง เนืองนอง</text>

</svg>