<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgPurple)"/>
  <!-- Golden Altar Pedestal Base -->
  <g filter="url(#dropShadow)">
    <!-- Base Plinth -->
    <rect x="100" y="310" width="312" height="60" rx="20" fill="#f59e0b" stroke="#b45309" stroke-width="6"/>
    <rect x="120" y="270" width="272" height="45" rx="14" fill="#fbbf24" stroke="#d97706" stroke-width="5"/>
    <rect x="150" y="210" width="212" height="65" rx="14" fill="#fde047" stroke="#d97706" stroke-width="5"/>
    <!-- Lotus Petal Decor on Base -->
    <circle cx="170" cy="300" r="16" fill="#ef4444"/>
    <circle cx="226" cy="300" r="16" fill="#3b82f6"/>
    <circle cx="286" cy="300" r="16" fill="#10b981"/>
    <circle cx="342" cy="300" r="16" fill="#ef4444"/>
    <!-- Top Incense / Flower Tray -->
    <ellipse cx="256" cy="190" rx="90" ry="25" fill="#f59e0b"/>
    <!-- Lotus Flower on Altar -->
    <circle cx="256" cy="150" r="30" fill="#ec4899"/>
    <circle cx="226" cy="165" r="24" fill="#f472b6"/>
    <circle cx="286" cy="165" r="24" fill="#f472b6"/>
  </g>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#7e22ce" text-anchor="middle">ฐ ฐาน เข้ามารอง</text>

</svg>