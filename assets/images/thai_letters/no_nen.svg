<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgWarm)"/>
  <!-- Cute Young Novice Monk in Saffron Robes -->
  <!-- Shaved Head -->
  <circle cx="256" cy="180" r="75" fill="#fed7aa" filter="url(#dropShadow)"/>
  <!-- Peaceful Eyes -->
  <path d="M 218 175 Q 230 185 242 175" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <path d="M 270 175 Q 282 185 294 175" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M 244 205 Q 256 218 268 205" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="212" cy="195" r="8" fill="#f43f5e" opacity="0.5"/>
  <circle cx="300" cy="195" r="8" fill="#f43f5e" opacity="0.5"/>
  <!-- Orange Saffron Robe -->
  <path d="M 180 250 L 332 250 L 342 390 L 170 390 Z" fill="#ea580c" filter="url(#dropShadow)"/>
  <path d="M 180 250 L 290 390 L 342 390 L 240 250 Z" fill="#f97316"/>
  <!-- Lotus Flower Held -->
  <circle cx="256" cy="330" r="22" fill="#ec4899" filter="url(#dropShadow)"/>
  <circle cx="256" cy="330" r="10" fill="#fbcfe8"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#c2410c" text-anchor="middle">ณ เณร ไม่มอง</text>

</svg>