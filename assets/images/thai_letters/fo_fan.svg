<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="toothWhite" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="brushHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Toothbrush in Hand -->
    <rect x="330" y="140" width="22" height="240" rx="11" transform="rotate(25 330 140)" fill="url(#brushHandle)"/>
    <rect x="335" y="120" width="34" height="45" rx="6" transform="rotate(25 335 120)" fill="#ffffff"/>
    <rect x="340" y="115" width="28" height="15" rx="4" transform="rotate(25 340 115)" fill="#38bdf8"/>

    <!-- Main Tooth Body with 2 Roots -->
    <path d="M 155 120 C 130 200 135 280 180 390 C 215 390 225 310 250 310 C 275 310 285 390 320 390 C 365 280 370 200 345 120 C 310 100 280 130 250 115 C 220 130 190 100 155 120 Z" fill="url(#toothWhite)"/>

    <!-- Shiny Specular Glint Stars -->
    <polygon points="175,130 180,145 195,145 183,155 187,170 175,160 163,170 167,155 155,145 170,145" fill="#facc15"/>

    <!-- Pixar Eyes & Happy Smile -->
    <circle cx="210" cy="210" r="15" fill="#0f172a"/>
    <circle cx="290" cy="210" r="15" fill="#0f172a"/>
    <circle cx="205" cy="204" r="5" fill="#ffffff"/>
    <circle cx="285" cy="204" r="5" fill="#ffffff"/>
    <circle cx="185" cy="230" r="16" fill="#f43f5e" opacity="0.3"/>
    <circle cx="315" cy="230" r="16" fill="#f43f5e" opacity="0.3"/>
    <path d="M 230 235 Q 250 260 270 235" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>

  </g>
</svg>