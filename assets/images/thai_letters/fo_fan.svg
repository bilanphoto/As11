<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Sparkling Healthy White Tooth Smiling -->
  <g filter="url(#dropShadow)">
    <path d="M 180 140 C 140 140 140 250 170 320 C 190 360 210 380 230 380 C 240 380 250 340 256 310 C 262 340 272 380 282 380 C 302 380 322 360 342 320 C 372 250 372 140 332 140 C 292 140 276 170 256 170 C 236 170 220 140 180 140 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="8"/>
  </g>
  <!-- Face on Tooth -->
  <circle cx="215" cy="230" r="14" fill="#0f172a"/>
  <circle cx="220" cy="225" r="4" fill="#ffffff"/>
  <circle cx="297" cy="230" r="14" fill="#0f172a"/>
  <circle cx="302" cy="225" r="4" fill="#ffffff"/>
  <circle cx="190" cy="250" r="12" fill="#f472b6" opacity="0.6"/>
  <circle cx="322" cy="250" r="12" fill="#f43f5e" opacity="0.6"/>
  <path d="M 235 260 Q 256 288 277 260" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  <!-- Sparkles -->
  <path d="M 150 130 L 155 110 L 160 130 L 180 135 L 160 140 L 155 160 L 150 140 L 130 135 Z" fill="#fbbf24" filter="url(#softGlow)"/>
  <path d="M 360 120 L 364 105 L 368 120 L 383 124 L 368 128 L 364 143 L 360 128 L 345 124 Z" fill="#38bdf8" filter="url(#softGlow)"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0284c7" text-anchor="middle">ฟ ฟัน สะอาดจัง</text>

</svg>