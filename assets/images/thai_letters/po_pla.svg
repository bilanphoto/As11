<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Cute 3D Clownfish Swimming with Bubbles -->
  <g filter="url(#dropShadow)">
    <!-- Tail Fin -->
    <path d="M 150 250 L 80 180 Q 90 250 80 320 Z" fill="#f97316" stroke="#ea580c" stroke-width="6"/>
    <!-- Fish Body -->
    <ellipse cx="270" cy="250" rx="130" ry="95" fill="#f97316"/>
    <!-- White Stripes -->
    <path d="M 230 158 Q 250 250 230 342 L 255 342 Q 275 250 255 158 Z" fill="#ffffff"/>
    <path d="M 310 170 Q 325 250 310 330 L 325 330 Q 340 250 325 170 Z" fill="#ffffff"/>
    <!-- Top & Bottom Fins -->
    <path d="M 220 160 Q 270 110 320 165 Z" fill="#ea580c"/>
    <path d="M 230 338 Q 270 380 300 335 Z" fill="#ea580c"/>
    <!-- Big Cute Eye -->
    <circle cx="340" cy="225" r="26" fill="#ffffff"/>
    <circle cx="346" cy="225" r="16" fill="#0f172a"/>
    <circle cx="352" cy="219" r="6" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M 370 250 Q 385 265 375 275" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Water Bubbles -->
  <circle cx="410" cy="180" r="14" fill="#bae6fd" opacity="0.7" filter="url(#softGlow)"/>
  <circle cx="430" cy="140" r="10" fill="#bae6fd" opacity="0.7" filter="url(#softGlow)"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0369a1" text-anchor="middle">ป ปลา ตากลม</text>

</svg>