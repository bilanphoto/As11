<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="fishOrange" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="90%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Tail Fin -->
    <path d="M 140 250 L 50 180 Q 75 250 50 320 Z" fill="url(#fishOrange)"/>

    <!-- Dorsal Top & Bottom Fins -->
    <path d="M 200 150 Q 250 80 320 130 Z" fill="url(#fishOrange)"/>
    <path d="M 220 350 Q 260 410 300 360 Z" fill="url(#fishOrange)"/>

    <!-- Main Fish Body -->
    <ellipse cx="260" cy="250" rx="150" ry="105" fill="url(#fishOrange)"/>

    <!-- Iconic White Striped Bands with Black Edging -->
    <path d="M 220 150 Q 250 250 220 350 L 255 350 Q 285 250 255 150 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <path d="M 135 185 Q 155 250 135 315 L 160 315 Q 180 250 160 185 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>

    <!-- Huge Pixar Fish Eyes -->
    <circle cx="340" cy="220" r="26" fill="#ffffff"/>
    <circle cx="346" cy="220" r="16" fill="#0f172a"/>
    <circle cx="342" cy="214" r="6" fill="#ffffff"/>

    <!-- Cute Smiling Fish Mouth -->
    <path d="M 390 260 Q 405 270 395 285" fill="none" stroke="#7c2d12" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Translucent Water Bubbles -->
    <circle cx="420" cy="180" r="14" fill="#38bdf8" opacity="0.6"/>
    <circle cx="445" cy="140" r="20" fill="#38bdf8" opacity="0.6"/>
    <circle cx="415" cy="110" r="10" fill="#38bdf8" opacity="0.6"/>

  </g>
</svg>