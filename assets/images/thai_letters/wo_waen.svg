<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="ringGold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <linearGradient id="diamondFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Thick Golden Ring Band -->
    <circle cx="250" cy="310" r="120" fill="none" stroke="url(#ringGold)" stroke-width="45"/>
    <circle cx="250" cy="310" r="120" fill="none" stroke="#fef08a" stroke-width="8" opacity="0.6"/>

    <!-- Diamond Setting Claws -->
    <path d="M 210 200 L 250 150 L 290 200 Z" fill="url(#ringGold)"/>

    <!-- Multi-Faceted Brilliant Cut Diamond -->
    <polygon points="175,150 325,150 290,80 210,80" fill="url(#diamondFacet)"/>
    <polygon points="175,150 250,220 325,150" fill="url(#diamondFacet)"/>
    <polygon points="210,80 250,150 290,80" fill="#ffffff" opacity="0.85"/>
    <polygon points="210,80 175,150 250,150" fill="#bae6fd" opacity="0.7"/>
    <polygon points="290,80 325,150 250,150" fill="#0284c7" opacity="0.4"/>

    <!-- Brilliant Sparkle Star Glints -->
    <polygon points="250,30 256,65 285,70 256,75 250,110 244,75 215,70 244,65" fill="#ffffff"/>
    <polygon points="160,90 163,110 180,113 163,116 160,135 157,116 140,113 157,110" fill="#ffffff" opacity="0.9"/>

  </g>
</svg>