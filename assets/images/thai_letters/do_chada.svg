<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgWarm)"/>
  <!-- Golden Ornate Thai Chada Headdress -->
  <g filter="url(#dropShadow)">
    <!-- Base Crown Ring -->
    <ellipse cx="256" cy="350" rx="110" ry="40" fill="#f59e0b" stroke="#b45309" stroke-width="6"/>
    <ellipse cx="256" cy="340" rx="95" ry="30" fill="#fde047"/>
    <!-- Jewels on base -->
    <circle cx="200" cy="345" r="10" fill="#ef4444"/>
    <circle cx="256" cy="350" r="12" fill="#10b981"/>
    <circle cx="312" cy="345" r="10" fill="#3b82f6"/>
    <!-- Tier 1 -->
    <path d="M 175 330 L 200 240 L 312 240 L 337 330 Z" fill="#fbbf24" stroke="#d97706" stroke-width="6"/>
    <!-- Tier 2 -->
    <path d="M 205 240 L 225 160 L 287 160 L 307 240 Z" fill="#fde047" stroke="#d97706" stroke-width="5"/>
    <!-- Spire Needle Tip -->
    <path d="M 236 160 L 256 60 L 276 160 Z" fill="#fbbf24" stroke="#b45309" stroke-width="5"/>
    <circle cx="256" cy="55" r="14" fill="#ef4444"/>
    <!-- Ear Ornaments (Kranok) -->
    <path d="M 155 350 Q 110 320 140 270 Q 170 300 165 340 Z" fill="#facc15" stroke="#d97706" stroke-width="4"/>
    <path d="M 357 350 Q 402 320 372 270 Q 342 300 347 340 Z" fill="#facc15" stroke="#d97706" stroke-width="4"/>
  </g>
  <!-- Sparkles -->
  <circle cx="256" cy="110" r="6" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="256" cy="200" r="6" fill="#ffffff" filter="url(#softGlow)"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#b45309" text-anchor="middle">ฎ ชฎา สวมพลัน</text>

</svg>