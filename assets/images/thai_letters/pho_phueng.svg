<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="beeYellow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="90%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <radialGradient id="wingGlow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Translucent Wings in Back -->
    <ellipse cx="190" cy="140" rx="60" ry="85" transform="rotate(-25 190 140)" fill="url(#wingGlow)"/>
    <ellipse cx="310" cy="140" rx="60" ry="85" transform="rotate(25 310 140)" fill="url(#wingGlow)"/>

    <!-- Chubby Bee Body -->
    <ellipse cx="250" cy="275" rx="125" ry="110" fill="url(#beeYellow)"/>

    <!-- Velvety Black Stripes -->
    <path d="M 180 185 Q 250 210 320 185 L 325 225 Q 250 250 175 225 Z" fill="#1e293b"/>
    <path d="M 150 265 Q 250 295 350 265 L 345 305 Q 250 335 155 305 Z" fill="#1e293b"/>

    <!-- Antennae with Rounded Tips -->
    <path d="M 215 175 Q 180 110 165 115" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="165" cy="115" r="9" fill="#eab308"/>
    <path d="M 285 175 Q 320 110 335 115" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="335" cy="115" r="9" fill="#eab308"/>

    <!-- Expressive Eyes & Smile -->
    <circle cx="210" cy="245" r="16" fill="#0f172a"/>
    <circle cx="290" cy="245" r="16" fill="#0f172a"/>
    <circle cx="205" cy="239" r="6" fill="#ffffff"/>
    <circle cx="285" cy="239" r="6" fill="#ffffff"/>
    <path d="M 235 275 Q 250 295 265 275" fill="none" stroke="#713f12" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Honey Clay Pot -->
    <path d="M 210 365 Q 250 350 290 365 L 305 435 Q 250 450 195 435 Z" fill="#ea580c"/>
    <ellipse cx="250" cy="365" rx="40" ry="12" fill="#facc15"/>

  </g>
</svg>