<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgWarm)"/>
  <!-- Kind Smiling Grandfather with Walking Stick -->
  <circle cx="256" cy="190" r="75" fill="#ffedd5" filter="url(#dropShadow)"/>
  <!-- White Hair -->
  <path d="M 181 190 Q 181 105 256 105 Q 331 105 331 190 Q 315 135 256 135 Q 197 135 181 190 Z" fill="#e2e8f0"/>
  <!-- Spectacles -->
  <circle cx="228" cy="185" r="18" fill="none" stroke="#475569" stroke-width="4"/>
  <circle cx="284" cy="185" r="18" fill="none" stroke="#475569" stroke-width="4"/>
  <line x1="246" y1="185" x2="266" y2="185" stroke="#475569" stroke-width="4"/>
  <!-- Eyes -->
  <path d="M 220 185 Q 228 178 236 185" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 276 185 Q 284 178 292 185" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M 240 220 Q 256 235 272 220" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <!-- Walking Stick -->
  <g filter="url(#dropShadow)">
    <path d="M 350 220 Q 370 200 370 230 L 370 380" fill="none" stroke="#92400e" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- Traditional Blue Shirt -->
  <path d="M 190 260 L 322 260 L 332 390 L 180 390 Z" fill="#3b82f6" filter="url(#dropShadow)"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#b45309" text-anchor="middle">ฒ ผู้เฒ่า เดินย่อง</text>

</svg>