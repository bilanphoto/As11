<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgWarm)"/>
  <!-- Two Golden Cymbals Tied with Silk Tassel -->
  <!-- Top Cymbal -->
  <g filter="url(#dropShadow)">
    <ellipse cx="210" cy="220" rx="110" ry="85" fill="#fbbf24" stroke="#d97706" stroke-width="6"/>
    <ellipse cx="210" cy="210" rx="80" ry="55" fill="#fef08a"/>
    <circle cx="210" cy="195" r="28" fill="#f59e0b"/>
    <!-- Cute Eyes on Cymbal -->
    <circle cx="185" cy="210" r="10" fill="#0f172a"/>
    <circle cx="188" cy="207" r="3" fill="#ffffff"/>
    <circle cx="235" cy="210" r="10" fill="#0f172a"/>
    <circle cx="238" cy="207" r="3" fill="#ffffff"/>
    <path d="M 200 226 Q 210 238 220 226" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Bottom Cymbal -->
  <g filter="url(#dropShadow)">
    <ellipse cx="320" cy="280" rx="100" ry="75" fill="#f59e0b" stroke="#b45309" stroke-width="6"/>
    <ellipse cx="320" cy="272" rx="72" ry="50" fill="#fde047"/>
    <circle cx="320" cy="260" r="24" fill="#d97706"/>
  </g>
  <!-- Colorful Silk String -->
  <path d="M 210 195 Q 260 140 320 260" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <!-- Red Tassel -->
  <path d="M 260 140 L 250 170 L 270 170 Z" fill="#ef4444"/>
  <circle cx="260" cy="140" r="10" fill="#dc2626"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#b45309" text-anchor="middle">ฉ ฉิ่ง ตีดัง</text>

</svg>