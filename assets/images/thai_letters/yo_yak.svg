<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgEmerald)"/>
  <!-- Cute Friendly Green Giant (Yaksha) with Crown & Smile -->
  <circle cx="256" cy="230" r="85" fill="#10b981" filter="url(#dropShadow)"/>
  <!-- Golden Crown -->
  <path d="M 186 170 L 226 70 L 256 40 L 286 70 L 326 170 Z" fill="#fbbf24" stroke="#d97706" stroke-width="5" filter="url(#dropShadow)"/>
  <!-- Big Eyes -->
  <circle cx="225" cy="225" r="16" fill="#ffffff"/>
  <circle cx="225" cy="225" r="10" fill="#0f172a"/>
  <circle cx="287" cy="225" r="16" fill="#ffffff"/>
  <circle cx="287" cy="225" r="10" fill="#0f172a"/>
  <!-- Cute Tusks (เขี้ยวขาว) -->
  <path d="M 215 270 Q 215 240 225 255" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M 297 270 Q 297 240 287 255" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="205" cy="245" r="12" fill="#f43f5e" opacity="0.6"/>
  <circle cx="307" cy="245" r="12" fill="#f43f5e" opacity="0.6"/>
  <!-- Smile -->
  <path d="M 235 260 Q 256 280 277 260" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <!-- Giant Club / Gada in hand -->
  <rect x="360" y="240" width="24" height="150" rx="10" fill="#f59e0b" filter="url(#dropShadow)"/>
  <circle cx="372" cy="230" r="28" fill="#d97706"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#065f46" text-anchor="middle">ย ยักษ์ เขี้ยวใหญ่</text>

</svg>