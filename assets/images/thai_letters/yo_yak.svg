<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="yakGreen" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <linearGradient id="goldYak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Giant Club held in hand -->
    <path d="M 370 180 L 400 390 L 360 410 L 340 200 Z" fill="url(#goldYak)"/>
    <circle cx="385" cy="180" r="22" fill="#ca8a04"/>

    <!-- Body -->
    <path d="M 160 310 Q 250 280 340 310 L 360 435 Q 250 455 140 435 Z" fill="#b91c1c"/>

    <!-- Green Giant Head -->
    <circle cx="250" cy="205" r="95" fill="url(#yakGreen)"/>

    <!-- Mini Golden Crown -->
    <polygon points="215,130 250,55 285,130" fill="url(#goldYak)"/>
    <circle cx="250" cy="65" r="8" fill="#ef4444"/>

    <!-- Expressive Eyes -->
    <circle cx="205" cy="195" r="18" fill="#ffffff"/>
    <circle cx="295" cy="195" r="18" fill="#ffffff"/>
    <circle cx="210" cy="195" r="11" fill="#0f172a"/>
    <circle cx="290" cy="195" r="11" fill="#0f172a"/>

    <!-- Curved White Tusks on Smile -->
    <path d="M 215 245 Q 250 270 285 245" fill="none" stroke="#14532d" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 210 255 Q 200 225 212 215 Q 218 235 220 255 Z" fill="#ffffff"/>
    <path d="M 290 255 Q 300 225 288 215 Q 282 235 280 255 Z" fill="#ffffff"/>

  </g>
</svg>