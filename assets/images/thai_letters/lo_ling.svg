<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgWarm)"/>
  <!-- Cute Smiling Monkey with Banana -->
  <!-- Ears -->
  <circle cx="170" cy="190" r="40" fill="#b45309" filter="url(#dropShadow)"/>
  <circle cx="170" cy="190" r="26" fill="#fed7aa"/>
  <circle cx="342" cy="190" r="40" fill="#b45309" filter="url(#dropShadow)"/>
  <circle cx="342" cy="190" r="26" fill="#fed7aa"/>
  <!-- Head & Body -->
  <circle cx="256" cy="210" r="80" fill="#b45309" filter="url(#dropShadow)"/>
  <path d="M 196 230 Q 256 160 316 230 Q 256 280 196 230 Z" fill="#fed7aa"/>
  <!-- Eyes -->
  <circle cx="228" cy="200" r="12" fill="#0f172a"/>
  <circle cx="232" cy="196" r="4" fill="#ffffff"/>
  <circle cx="284" cy="200" r="12" fill="#0f172a"/>
  <circle cx="288" cy="196" r="4" fill="#ffffff"/>
  <circle cx="210" cy="225" r="10" fill="#f43f5e" opacity="0.6"/>
  <circle cx="302" cy="225" r="10" fill="#f43f5e" opacity="0.6"/>
  <path d="M 240 240 Q 256 260 272 240" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <!-- Yellow Banana -->
  <path d="M 230 330 Q 260 380 320 340 Q 280 360 250 330 Z" fill="#facc15" stroke="#ca8a04" stroke-width="4" filter="url(#dropShadow)"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#78350f" text-anchor="middle">ล ลิง ไต่ราว</text>

</svg>