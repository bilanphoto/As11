<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="monkeyFur" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="65%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="monkeyFace" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="70%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Curled Tail -->
    <path d="M 150 380 Q 70 380 70 300 Q 70 240 120 250 Q 85 270 95 320 Q 110 360 160 360" fill="url(#monkeyFur)"/>

    <!-- Body -->
    <ellipse cx="250" cy="350" rx="115" ry="90" fill="url(#monkeyFur)"/>

    <!-- Ears -->
    <circle cx="150" cy="200" r="42" fill="url(#monkeyFur)"/>
    <circle cx="150" cy="200" r="24" fill="url(#monkeyFace)"/>
    <circle cx="350" cy="200" r="42" fill="url(#monkeyFur)"/>
    <circle cx="350" cy="200" r="24" fill="url(#monkeyFace)"/>

    <!-- Head -->
    <circle cx="250" cy="205" r="95" fill="url(#monkeyFur)"/>
    <!-- Heart Shaped Face Mask -->
    <path d="M 200 230 C 180 150 250 150 250 190 C 250 150 320 150 300 230 C 290 280 210 280 200 230 Z" fill="url(#monkeyFace)"/>

    <!-- Eyes & Big Smile -->
    <circle cx="225" cy="205" r="14" fill="#0f172a"/>
    <circle cx="275" cy="205" r="14" fill="#0f172a"/>
    <circle cx="220" cy="200" r="5" fill="#ffffff"/>
    <circle cx="270" cy="200" r="5" fill="#ffffff"/>
    <path d="M 230 245 Q 250 265 270 245" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Peeled Yellow Banana Held in Paws -->
    <path d="M 220 370 Q 250 410 300 370 Q 260 430 220 370 Z" fill="#facc15"/>

  </g>
</svg>