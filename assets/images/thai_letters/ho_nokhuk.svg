<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="owlFeather" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="90%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Owl Body -->
    <ellipse cx="250" cy="285" rx="130" ry="120" fill="url(#owlFeather)"/>
    <ellipse cx="250" cy="300" rx="80" ry="85" fill="#ffedd5"/>

    <!-- Feather Tufts on Ears -->
    <polygon points="140,160 170,110 200,160" fill="#c2410c"/>
    <polygon points="300,160 330,110 360,160" fill="#c2410c"/>

    <!-- Huge Golden Spectacles -->
    <circle cx="195" cy="235" r="42" fill="none" stroke="#facc15" stroke-width="8"/>
    <circle cx="305" cy="235" r="42" fill="none" stroke="#facc15" stroke-width="8"/>
    <line x1="237" y1="235" x2="263" y2="235" stroke="#facc15" stroke-width="8"/>

    <!-- Huge Glowing Big Eyes -->
    <circle cx="195" cy="235" r="34" fill="#ffffff"/>
    <circle cx="305" cy="235" r="34" fill="#ffffff"/>
    <circle cx="195" cy="235" r="22" fill="#0f172a"/>
    <circle cx="305" cy="235" r="22" fill="#0f172a"/>
    <circle cx="188" cy="226" r="8" fill="#ffffff"/>
    <circle cx="298" cy="226" r="8" fill="#ffffff"/>

    <!-- Orange Beak -->
    <polygon points="240,260 260,260 250,285" fill="#ea580c"/>

    <!-- Graduation Mortarboard Hat -->
    <polygon points="250,85 160,120 250,145 340,120" fill="#1e293b"/>
    <rect x="220" y="130" width="60" height="30" fill="#0f172a"/>
    <circle cx="250" cy="115" r="6" fill="#facc15"/>
    <path d="M 250 115 Q 290 135 295 165" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>

  </g>
</svg>