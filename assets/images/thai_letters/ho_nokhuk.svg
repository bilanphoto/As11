<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgPurple)"/>
  <!-- Cute Big-eyed Owl on Tree Branch -->
  <g filter="url(#dropShadow)">
    <!-- Owl Body -->
    <ellipse cx="256" cy="250" rx="90" ry="100" fill="#6366f1"/>
    <ellipse cx="256" cy="280" rx="65" ry="65" fill="#c7d2fe"/>
    <!-- Ear Tufts -->
    <polygon points="186,160 216,110 236,170" fill="#4f46e5"/>
    <polygon points="326,160 296,110 276,170" fill="#4f46e5"/>
    <!-- Huge Cute Round Eyes -->
    <circle cx="215" cy="210" r="36" fill="#ffffff" stroke="#e0e7ff" stroke-width="6"/>
    <circle cx="215" cy="210" r="22" fill="#0f172a"/>
    <circle cx="223" cy="202" r="8" fill="#ffffff"/>
    <circle cx="297" cy="210" r="36" fill="#ffffff" stroke="#e0e7ff" stroke-width="6"/>
    <circle cx="297" cy="210" r="22" fill="#0f172a"/>
    <circle cx="305" cy="202" r="8" fill="#ffffff"/>
    <!-- Cute Beak -->
    <polygon points="250,230 262,230 256,245" fill="#f59e0b"/>
    <!-- Wings -->
    <ellipse cx="165" cy="270" rx="20" ry="50" fill="#4f46e5"/>
    <ellipse cx="347" cy="270" rx="20" ry="50" fill="#4f46e5"/>
    <!-- Tree Branch -->
    <rect x="110" y="340" width="292" height="24" rx="12" fill="#92400e"/>
  </g>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#4338ca" text-anchor="middle">ฮ นกฮูก ตาโต</text>

</svg>