<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="leaf3d" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="dewDrop" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </radialGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Curving Leaf Stem -->
    <path d="M 250 435 Q 230 380 250 320" fill="none" stroke="#15803d" stroke-width="14" stroke-linecap="round"/>

    <!-- Volumetric Leaf Body -->
    <path d="M 250 85 C 380 150 410 320 250 410 C 90 320 120 150 250 85 Z" fill="url(#leaf3d)"/>

    <!-- Embossed Main Vein and Ribs -->
    <path d="M 250 95 L 250 405" stroke="#bbf7d0" stroke-width="6" stroke-linecap="round"/>
    <path d="M 250 170 Q 320 190 345 220" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 170 Q 180 190 155 220" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 260 Q 330 280 340 310" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 260 Q 170 280 160 310" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>

    <!-- Cute Smiling Face on Leaf -->
    <circle cx="215" cy="225" r="12" fill="#0f172a"/>
    <circle cx="285" cy="225" r="12" fill="#0f172a"/>
    <circle cx="211" cy="220" r="4" fill="#ffffff"/>
    <circle cx="281" cy="220" r="4" fill="#ffffff"/>
    <path d="M 235 245 Q 250 260 265 245" fill="none" stroke="#14532d" stroke-width="4" stroke-linecap="round"/>

    <!-- Crystal Clear 3D Dewdrop with Specular Glint -->
    <circle cx="280" cy="150" r="22" fill="url(#dewDrop)"/>
    <circle cx="273" cy="142" r="7" fill="#ffffff"/>

  </g>
</svg>