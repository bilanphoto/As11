<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgEmerald)"/>
  <!-- Cute Smiling Green Monstera Leaf with Dewdrops -->
  <g filter="url(#dropShadow)">
    <path d="M 256 80 Q 380 150 360 300 Q 330 380 256 380 Q 182 380 152 300 Q 132 150 256 80 Z" fill="#22c55e" stroke="#16a34a" stroke-width="6"/>
    <!-- Stem -->
    <path d="M 256 100 L 256 420" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
    <!-- Veins -->
    <path d="M 256 180 Q 300 170 330 190" stroke="#15803d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 256 220 Q 210 210 180 230" stroke="#15803d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 256 260 Q 300 250 330 270" stroke="#15803d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 256 300 Q 210 290 180 310" stroke="#15803d" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Smiling Face on Leaf -->
  <circle cx="225" cy="240" r="10" fill="#0f172a"/>
  <circle cx="228" cy="237" r="3" fill="#ffffff"/>
  <circle cx="287" cy="240" r="10" fill="#0f172a"/>
  <circle cx="290" cy="237" r="3" fill="#ffffff"/>
  <circle cx="205" cy="255" r="8" fill="#f43f5e" opacity="0.6"/>
  <circle cx="307" cy="255" r="8" fill="#f43f5e" opacity="0.6"/>
  <path d="M 242 260 Q 256 275 270 260" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <!-- Dewdrop -->
  <ellipse cx="310" cy="150" rx="12" ry="16" fill="#38bdf8" opacity="0.8" filter="url(#softGlow)"/>
  <text x="256" y="455" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#14532d" text-anchor="middle">บ ใบไม้ ทับถม</text>

</svg>