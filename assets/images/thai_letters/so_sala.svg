<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgEmerald)"/>
  <!-- Traditional Thai Wooden Pavilion / Gazebo -->
  <g filter="url(#dropShadow)">
    <!-- Floor Plinth -->
    <rect x="120" y="340" width="272" height="30" rx="8" fill="#b45309"/>
    <!-- Pillars -->
    <rect x="150" y="220" width="16" height="130" fill="#78350f"/>
    <rect x="200" y="220" width="16" height="130" fill="#78350f"/>
    <rect x="296" y="220" width="16" height="130" fill="#78350f"/>
    <rect x="346" y="220" width="16" height="130" fill="#78350f"/>
    <!-- Thai Tiered Gabled Roof -->
    <path d="M 80 230 Q 256 160 432 230 L 392 200 Q 256 120 120 200 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="4"/>
    <path d="M 140 180 Q 256 90 372 180 L 342 150 Q 256 70 170 150 Z" fill="#f59e0b" stroke="#d97706" stroke-width="4"/>
    <!-- Peak Spire -->
    <line x1="256" y1="70" x2="256" y2="40" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#065f46" text-anchor="middle">ศ ศาลา เงียบเหงา</text>

</svg>