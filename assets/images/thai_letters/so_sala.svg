<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 3D Studio Background -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    
    <!-- 3D Ground Contact Shadow Filter -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    
    <!-- 3D Volumetric Depth Drop Shadow Filter -->
    <filter id="clayShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
    <!-- Specular Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="roofOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="pillarWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

  </defs>

  <!-- Studio Backdrop Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="250" cy="445" rx="145" ry="24" fill="#64748b" opacity="0.35" filter="url(#groundShadow)"/>
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#1e293b" opacity="0.45" filter="url(#groundShadow)"/>

  <!-- 3D Model Layer -->
  <g filter="url(#clayShadow)">

    <!-- Wooden Raised Platform Floor -->
    <rect x="100" y="380" width="300" height="40" rx="10" fill="url(#pillarWood)"/>

    <!-- 4 Wooden Pillars -->
    <rect x="140" y="220" width="22" height="170" rx="8" fill="url(#pillarWood)"/>
    <rect x="200" y="220" width="20" height="170" rx="8" fill="url(#pillarWood)"/>
    <rect x="280" y="220" width="20" height="170" rx="8" fill="url(#pillarWood)"/>
    <rect x="340" y="220" width="22" height="170" rx="8" fill="url(#pillarWood)"/>

    <!-- Lower Tier Roof -->
    <path d="M 80 250 Q 250 200 420 250 L 390 180 Q 250 150 110 180 Z" fill="url(#roofOrange)"/>

    <!-- Upper Tier Curved Thai Roof with Finials (ช่อฟ้า) -->
    <path d="M 120 190 Q 250 130 380 190 L 350 110 Q 250 80 150 110 Z" fill="url(#roofOrange)"/>
    <!-- Apex Finial (ช่อฟ้า) -->
    <path d="M 250 85 L 250 35 L 260 50 Z" fill="#ca8a04"/>

  </g>
</svg>