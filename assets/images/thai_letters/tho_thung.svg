<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="48" fill="#ffffff"/>
  
  <rect x="16" y="16" width="480" height="480" rx="40" fill="url(#bgSky)"/>
  <!-- Cute Colorful Polka-dot Gift Bag with Smiling Face -->
  <!-- Bag Handle -->
  <path d="M 210 160 Q 210 90 256 90 Q 302 90 302 160" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" filter="url(#dropShadow)"/>
  <!-- Bag Body -->
  <path d="M 160 160 L 352 160 L 372 380 L 140 380 Z" fill="#38bdf8" filter="url(#dropShadow)"/>
  <!-- Polka Dots -->
  <circle cx="190" cy="210" r="14" fill="#ffffff" opacity="0.7"/>
  <circle cx="320" cy="210" r="14" fill="#ffffff" opacity="0.7"/>
  <circle cx="180" cy="330" r="16" fill="#ffffff" opacity="0.7"/>
  <circle cx="330" cy="330" r="16" fill="#ffffff" opacity="0.7"/>
  <circle cx="256" cy="350" r="16" fill="#ffffff" opacity="0.7"/>
  <!-- Smiling Face on Bag -->
  <circle cx="225" cy="260" r="12" fill="#0f172a"/>
  <circle cx="229" cy="256" r="4" fill="#ffffff"/>
  <circle cx="287" cy="260" r="12" fill="#0f172a"/>
  <circle cx="291" cy="256" r="4" fill="#ffffff"/>
  <circle cx="205" cy="275" r="10" fill="#f43f5e" opacity="0.6"/>
  <circle cx="307" cy="275" r="10" fill="#f43f5e" opacity="0.6"/>
  <path d="M 240 285 Q 256 305 272 285" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <text x="256" y="445" font-family="'Sarabun', sans-serif" font-size="34" font-weight="bold" fill="#0284c7" text-anchor="middle">ถ ถุง แบกขน</text>

</svg>